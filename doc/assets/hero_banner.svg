<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A11" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 52px; fill: url(#primaryGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 21px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #F1F5F9; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #A5B4FC; letter-spacing: 1px; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg)" />

  <!-- Ambient Light Blobs -->
  <circle cx="200" cy="80" r="140" fill="#4F46E5" opacity="0.18" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="160" fill="#EC4899" opacity="0.12" filter="url(#glow)" />
  <circle cx="650" cy="180" r="180" fill="#06B6D4" opacity="0.12" filter="url(#glow)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Header Category Tag -->
  <rect x="70" y="45" width="220" height="28" rx="14" fill="#312E81" stroke="#6366F1" stroke-width="1" />
  <text x="92" y="64" class="tag-text">⚡ ZERO-MODEL BUNDLE</text>

  <!-- Title & Subtitle -->
  <text x="70" y="130" class="title">flutter_on_device_ai</text>
  <text x="70" y="172" class="subtitle">Unified On-Device GenAI across Apple, Android, Windows &amp; Web</text>
  <text x="70" y="202" class="subtitle" font-size="16" fill="#64748B">Native NPU Acceleration · Structured JSON · Dart Tool Calling · GenUI · Smart Gemma Fallback</text>

  <!-- Platform Cards / Chips Row -->
  <g transform="translate(70, 240)">
    <!-- Apple Foundation Models -->
    <rect x="0" y="0" width="200" height="60" rx="12" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
    <text x="20" y="27" class="badge-text" fill="#FFFFFF">🍎 Apple Intelligence</text>
    <text x="20" y="47" font-size="11" fill="#94A3B8" font-family="sans-serif">Foundation Models (iOS/macOS)</text>

    <!-- Google Gemini Nano -->
    <rect x="215" y="0" width="200" height="60" rx="12" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
    <text x="235" y="27" class="badge-text" fill="#FFFFFF">🤖 Google Gemini Nano</text>
    <text x="235" y="47" font-size="11" fill="#94A3B8" font-family="sans-serif">ML Kit GenAI &amp; AICore</text>

    <!-- Chrome Prompt API -->
    <rect x="430" y="0" width="200" height="60" rx="12" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
    <text x="450" y="27" class="badge-text" fill="#FFFFFF">🌐 Chrome Prompt API</text>
    <text x="450" y="47" font-size="11" fill="#94A3B8" font-family="sans-serif">window.ai / Built-in Web</text>

    <!-- Windows AI Foundry -->
    <rect x="645" y="0" width="200" height="60" rx="12" fill="url(#pillGrad)" stroke="#475569" stroke-width="1" />
    <text x="665" y="27" class="badge-text" fill="#FFFFFF">🪟 Windows AI Foundry</text>
    <text x="665" y="47" font-size="11" fill="#94A3B8" font-family="sans-serif">WinRT &amp; Copilot+ PC</text>

    <!-- Fallback flutter_gemma -->
    <rect x="860" y="0" width="200" height="60" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.2" />
    <text x="880" y="27" class="badge-text" fill="#C7D2FE">💎 flutter_gemma Fallback</text>
    <text x="880" y="47" font-size="11" fill="#A5B4FC" font-family="sans-serif">Auto-routes on older OSes</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(70, 335)">
    <!-- 0 MB Bundle -->
    <rect x="0" y="0" width="170" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
    <text x="20" y="23" font-size="13" font-weight="700" fill="#34D399" font-family="sans-serif">📦 0 MB Checkpoint</text>

    <!-- 100% Offline -->
    <rect x="185" y="0" width="165" height="36" rx="18" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-width="1" />
    <text x="205" y="23" font-size="13" font-weight="700" fill="#A5B4FC" font-family="sans-serif">🔒 100% Private &amp; Offline</text>

    <!-- Zero Latency -->
    <rect x="365" y="0" width="165" height="36" rx="18" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1" />
    <text x="385" y="23" font-size="13" font-weight="700" fill="#67E8F9" font-family="sans-serif">⚡ Hardware NPU</text>

    <!-- Dart Tool Calling -->
    <rect x="545" y="0" width="180" height="36" rx="18" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" />
    <text x="565" y="23" font-size="13" font-weight="700" fill="#FCD34D" font-family="sans-serif">🛠️ Native Dart Tools</text>

    <!-- GenUI Blocks -->
    <rect x="740" y="0" width="180" height="36" rx="18" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-width="1" />
    <text x="760" y="23" font-size="13" font-weight="700" fill="#F472B6" font-family="sans-serif">🎨 GenUI Integration</text>
  </g>
</svg>
