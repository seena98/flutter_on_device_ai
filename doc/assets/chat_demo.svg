<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="aiBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="toolCardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    
    .window-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #94A3B8; }
    .msg-user { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #FFFFFF; }
    .msg-ai { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #F1F5F9; line-height: 1.5; }
    .cursor { animation: blink 0.8s infinite; fill: #6366F1; }
    .meta-text { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #38BDF8; }
    .tool-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #FBBF24; }
    .tool-code { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #E2E8F0; }
  </style>

  <!-- Container Box with Shadow -->
  <rect x="25" y="20" width="850" height="480" rx="14" fill="url(#windowBg)" stroke="#334155" stroke-width="1" filter="url(#shadow)" />

  <!-- Window Bar -->
  <path d="M 25 34 A 14 14 0 0 1 39 20 L 861 20 A 14 14 0 0 1 875 34 L 875 58 L 25 58 Z" fill="#1E293B" />
  <line x1="25" y1="58" x2="875" y2="58" stroke="#334155" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="50" cy="39" r="6" fill="#EF4444" />
  <circle cx="70" cy="39" r="6" fill="#F59E0B" />
  <circle cx="90" cy="39" r="6" fill="#10B981" />

  <!-- Window Title -->
  <text x="450" y="44" text-anchor="middle" class="window-header">⚡ flutter_on_device_ai · Real-time Streaming &amp; Tool Calling</text>

  <!-- Status Bar / Diagnostic Pill -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="780" height="34" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#10B981" />
    <text x="32" y="21" class="meta-text" fill="#10B981">MODEL READY</text>
    <text x="140" y="21" class="meta-text" fill="#64748B">|</text>
    <text x="155" y="21" class="meta-text" fill="#94A3B8">Apple Intelligence (FoundationModels) / Gemini Nano</text>
    <text x="680" y="21" class="meta-text" fill="#38BDF8">54.2 tok/s · 18ms</text>
  </g>

  <!-- Message 1: User Prompt -->
  <g transform="translate(480, 130)">
    <rect x="0" y="0" width="360" height="48" rx="16" fill="url(#userBubble)" />
    <text x="18" y="28" class="msg-user">Set living room to 21°C and give me a brief.</text>
  </g>

  <!-- Message 2: Tool Calling Action Card -->
  <g transform="translate(60, 195)">
    <rect x="0" y="0" width="620" height="74" rx="12" fill="url(#toolCardGrad)" stroke="#6366F1" stroke-width="1" />
    <text x="18" y="24" class="tool-title">🛠️ NATIVE TOOL INVOKED: OnDeviceAiTool('setThermostat')</text>
    <text x="18" y="45" class="tool-code">arguments: {"temp": 21.0, "room": "living_room"}</text>
    <text x="18" y="63" class="tool-code" fill="#34D399">↳ Dart callback result: {"status": "success", "currentTemp": 21.0}</text>
  </g>

  <!-- Message 3: AI Streamed Response -->
  <g transform="translate(60, 285)">
    <rect x="0" y="0" width="680" height="110" rx="16" fill="url(#aiBubble)" stroke="#475569" stroke-width="1" />
    
    <!-- Avatar Icon -->
    <circle cx="28" cy="30" r="14" fill="#6366F1" />
    <text x="28" y="35" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="bold">AI</text>

    <!-- Decoded Text -->
    <text x="56" y="32" class="msg-ai">Thermostat set to 21.0°C in the living room.</text>
    <text x="56" y="56" class="msg-ai">Here is your morning brief:</text>
    <text x="56" y="80" class="msg-ai">• 9:30 AM: Sprint Review (Engineering Room 2)</text>
    <text x="56" y="100" class="msg-ai">• 11:00 AM: Flutter 3.44 Architecture sync</text>
    <rect x="365" y="88" width="7" height="15" class="cursor" />
  </g>

  <!-- Interactive Terminal Prompt Footer -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="780" height="46" rx="10" fill="#0B132B" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#6366F1">&gt;</text>
    <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#64748B">Type a prompt or task for the on-device model...</text>
    
    <!-- Send Button Icon -->
    <rect x="735" y="8" width="30" height="30" rx="15" fill="#6366F1" />
    <path d="M 746 23 L 755 18 L 746 13 Z" fill="#FFFFFF" />
  </g>
</svg>
