name: flutter_device_ai
description: >-
  On-device generative AI for Flutter: Apple Foundation Models, Gemini Nano and
  Chrome built-in AI with streaming, tool calling and JSON-schema output.
version: 0.3.0
homepage: https://github.com/seena98/flutter_on_device_ai
repository: https://github.com/seena98/flutter_on_device_ai
issue_tracker: https://github.com/seena98/flutter_on_device_ai/issues
topics:
  - ai
  - llm
  - on-device
  - gemini-nano
  - foundation-models

environment:
  sdk: ^3.10.7
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  llamadart: ^0.16.0
  llamadart_llama_cpp_flutter: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutter_device_ai
        pluginClass: FlutterDeviceAiPlugin
      ios:
        pluginClass: FlutterDeviceAiPlugin
      macos:
        pluginClass: FlutterDeviceAiPlugin
      linux:
        dartPluginClass: FlutterDeviceAiDesktopStub
      windows:
        dartPluginClass: FlutterDeviceAiDesktopStub
      web:
        pluginClass: FlutterDeviceAiWeb
        fileName: flutter_device_ai_web.dart
