name: flutter_device_ai
description: >-
  Run generative AI on the device with zero bundled models. Uses Apple
  Foundation Models, Gemini Nano (Android) and Chrome built-in AI, with
  streaming, tool calling, JSON-schema output and an Edge AI fallback.
version: 0.1.0
homepage: https://github.com/seena98/flutter_on_device_ai
repository: https://github.com/seena98/flutter_on_device_ai
issue_tracker: https://github.com/seena98/flutter_on_device_ai/issues
topics:
  - ai
  - llm
  - on-device
  - gemini-nano
  - foundation-models

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutter_device_ai
        pluginClass: FlutterDeviceAiPlugin
      ios:
        pluginClass: FlutterDeviceAiPlugin
      macos:
        pluginClass: FlutterDeviceAiPlugin
      linux:
        dartPluginClass: FlutterDeviceAiDesktopStub
      windows:
        dartPluginClass: FlutterDeviceAiDesktopStub
      web:
        pluginClass: FlutterDeviceAiWeb
        fileName: flutter_device_ai_web.dart
